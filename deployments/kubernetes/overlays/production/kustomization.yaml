apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idp-core

resources:
  - ../../base

# Production-specific patches
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idp-core
        namespace: idp-core
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: idp-core
                resources:
                  requests:
                    cpu: "200m"
                    memory: "256Mi"
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: idp-core-cron
        namespace: idp-core
      spec:
        template:
          spec:
            containers:
              - name: idp-core-cron
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: idp-core-config
        namespace: idp-core
      data:
        DB_SSLMODE: require

# Image tags for production
images:
  - name: ghcr.io/davidsugianto/idp-core
    newTag: v1.0.0
  - name: ghcr.io/davidsugianto/idp-core-cron
    newTag: v1.0.0
